; MeshSat ESP32 node firmware.
; Hardware, pins and sources: README.md and docs/REFERENCES.md.

[platformio]
default_envs = xiao-esp32s3-wio-sx1262
test_dir = tests

[env:xiao-esp32s3-wio-sx1262]
; Same pioarduino release that upstream Meshtastic builds its ESP32 targets with
; (variants/esp32/esp32-common.ini, 55.03.311 = Arduino core 3.3.11 on ESP-IDF 5.5),
; so this code can move into a Meshtastic fork later without a core change.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; Stock board file: 8 MB flash, OPI PSRAM, USB CDC on boot (Serial = USB).
board = seeed_xiao_esp32s3
build_flags =
  -I boards/xiao-esp32s3-wio-sx1262
  -I src
  ; BLE console PIN from the build environment, never stored in the repository.
  ; Unset, or not 6 to 16 characters: the BLE console stays off. Use digits.
  '-D MESHSAT_BLE_CONSOLE_PIN="${sysenv.MESHSAT_BLE_CONSOLE_PIN}"'
; The core compiles with -std=gnu++2a; our sources stay C++17, the standard
; upstream Meshtastic builds with, so nothing here needs changing for a fork.
build_src_flags =
  -std=gnu++17
  -Wall
  -Wextra
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = *

; Host unit tests for the hardware-independent code (AT parser, modem state machine).
; Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<iridium/>
build_flags =
  -std=c++17
  -I src
  -Wall
  -Wextra
